# Render blueprint: a free Python web service. Render sets PORT; HOST=0.0.0.0 makes the server reachable.
# Secrets (GROQ_API_KEY, DEMO_ACCESS_CODE, optional GEMINI_API_KEY) are entered in the Render dashboard, never here.
services:
  - type: web
    name: ledger-pdf-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
